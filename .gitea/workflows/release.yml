name: Release

# Publishes the package to npm when a vX.Y.Z tag is pushed (or dispatched) and creates
# a Gitea release. Safe to re-run: publishing is idempotent (skipped when the version is
# already on npm, e.g. because the GitHub release got there first).
#
# Secrets: NPM_TOKEN (npm granular token with "bypass 2FA"), GITEA_TOKEN (release API).
# No provenance here: npm provenance needs GitHub's OIDC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.1)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish, release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3
        with:
          version: "0.116.1"

      - name: Install git-cliff
        continue-on-error: true
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: git-cliff

      # The tag must be vX.Y.Z and equal the version in package.json.
      - name: Validate tag
        id: tag
        run: nu scripts/ci/validate_tag.nu "$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - run: bun install --frozen-lockfile

      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

      - name: Publish to npm
        run: nu scripts/ci/npm_publish.nu
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Gitea release
        run: nu scripts/ci/gitea_release.nu "$TAG" --api "$API"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
